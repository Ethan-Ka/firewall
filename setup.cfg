# Packaging for the `firewall` CLI.
#
# This is setup.cfg rather than pyproject.toml, which is the older of the two
# spellings and would otherwise be the wrong choice. It is deliberate, and the
# reason is entirely Vercel's.
#
# Vercel decides what kind of project a repository is before it looks at what is
# in it. Its generic Python preset matches on filename alone -- requirements.txt,
# pyproject.toml, or Pipfile in the deployment root, with no attention paid to
# what any of them declare -- and once matched, that preset takes precedence over
# file-based functions: the whole site is expected to be one WSGI application,
# every route is handed to it, and nothing under api/ is built as a function at
# all. There is no flag that turns this off. A .vercelignore does not help,
# because detection reads the repository, not the upload.
#
# So the file is not there. setup.cfg and setup.py are not on that list, express
# the same metadata, and leave `pip install -e .` and `pip install -e ".[llm]"`
# working exactly as the README says they do.

[metadata]
name = firewall
version = 0.1.0
description = Ambient display showing what call the fire truck driving past your house is running
license_files = LICENSE

[options]
packages = firewall
python_requires = >=3.10
include_package_data = True
install_requires =
    requests>=2.31

[options.extras_require]
# needed for any real audio source
listen =
    faster-whisper>=1.0
# optional smarter transcript parser
llm =
    anthropic>=0.40

[options.entry_points]
console_scripts =
    firewall = firewall.__main__:main

[options.package_data]
firewall =
    display.html
