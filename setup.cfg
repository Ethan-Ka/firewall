# Packaging for the `firewall` CLI.
#
# This is setup.cfg rather than pyproject.toml, which is the older of the two
# spellings and would otherwise be the wrong choice. It is defensive, and the
# reason is Vercel's.
#
# Vercel's generic Python preset matches on filename alone -- requirements.txt,
# pyproject.toml or Pipfile in the build root, with no attention paid to what
# any of them declares. Matching it would end this deployment: the preset
# carries useRuntime "@vercel/python", so it forces the Python builder whether
# or not a .py file is near, and a Python preset takes precedence over
# file-based functions -- every route would go to one WSGI application that
# does not exist here, and nothing under api/ would be built at all.
#
# .vercelignore does keep these files out of the upload, and that alone was
# enough. This is the second lock rather than the first: an ignore list is one
# edit away from stopping, and the failure it would let through is not a broken
# page but a silent one, a build that succeeds and serves nothing. setup.cfg
# and setup.py are not names that preset looks for, they express the same
# metadata, and they leave `pip install -e .` and `pip install -e ".[llm]"`
# working exactly as the README says -- through PEP 660, not the deprecated
# setup.py develop path.
#
# What none of this can reach is the copy of the preset saved against the
# project itself, which outlives the file that caused it. That one is a
# dashboard setting, and api/README.md says so.

[metadata]
name = firewall
version = 0.1.0
description = Ambient display showing what call the fire truck driving past your house is running
license_files = LICENSE

[options]
packages = firewall
python_requires = >=3.10
include_package_data = True
install_requires =
    requests>=2.31

[options.extras_require]
# needed for any real audio source
listen =
    faster-whisper>=1.0
# optional smarter transcript parser
llm =
    anthropic>=0.40

[options.entry_points]
console_scripts =
    firewall = firewall.__main__:main

[options.package_data]
firewall =
    display.html
